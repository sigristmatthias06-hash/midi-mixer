name: Windows build and core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build, hardware-free tests and package
        shell: pwsh
        run: ./scripts/Prepare-Release.ps1
      - name: Keep candidate for manual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MidiMixer-win-x64-candidate
          path: |
            artifacts/release-*/*.zip
            artifacts/release-*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# This workflow creates CI artifacts only. It never creates a GitHub Release,
# pushes a tag or publishes a package. Publication remains a separate decision.
